name: Validate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_ableton*.py'
      - run: python3 -m pip install -r scripts/requirements-resample.txt
      - run: python3 -m unittest discover -s tests -p 'test_resample.py'
      - run: npm run lint:projects
      - run: npm run build:internal
      - run: npm run build:production
      - run: npx wrangler deploy --dry-run
