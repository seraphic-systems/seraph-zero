<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Seraphic Systems</title>
  <meta name="description" content="{{ description }}">
  <meta property="og:title" content="{{ title }} · Seraphic Systems">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/shared/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/journal/journal.css">
  {{{ styles }}}
  {{{ scripts }}}
</head>
<body data-entry="{{ entry }}">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="/">Seraphic Systems <span>Co.</span></a>
    <nav aria-label="Main navigation">
      <a href="/journal/" aria-current="{{ current }}">Journal</a>
      <a href="/orb/">Explore Orb <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="content" tabindex="-1">{{{ content }}}</main>
  <footer class="site-footer">
    <a href="/">Seraphic Systems Co.</a>
    <p>Stories above. A world underneath.</p>
    <a href="/orb/">Explore the catalog <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
