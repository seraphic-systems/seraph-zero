<article class="journal-entry">
  <header class="entry-header">
    <a class="back-link" href="/journal/">← All entries</a>
    <p class="eyebrow">{{{ date }}}</p>
    <h1>{{ title }}</h1>
    <p class="entry-description">{{ description }}</p>
  </header>
  <div class="entry-body">{{{ content }}}</div>
  <nav class="entry-end" aria-label="Continue exploring"><a href="/journal/">← Back to the journal</a><a href="/orb/">Explore Orb ↗</a></nav>
</article>
