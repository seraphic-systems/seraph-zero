<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A spatial view of your internal music library.">
  <title>Orb · Internal</title>
  <link rel="icon" href="/shared/favicon.ico">
  <link rel="stylesheet" href="/orb/orb.css">
  <script type="module" src="/orb/app.js"></script>
</head>
<body>
  <main id="world" aria-label="Orb music workspace" tabindex="-1">
    <header class="masthead"><a href="/orb/" id="home-link">internal <span>/ orb</span></a><a href="/">Classic workspace ↗</a></header>
    <nav id="trail" aria-label="Breadcrumb"></nav>
    <div id="circles" aria-label="Library"></div>
    <section id="detail" aria-label="Details" hidden></section>
    <aside id="view-lens" aria-label="Current view" hidden>
      <button id="view-toggle" type="button" aria-label="Open view options" aria-expanded="false" aria-controls="view-content">View</button>
      <div id="view-content" hidden></div>
    </aside>
    <aside id="lens" aria-label="Your space"><button id="nav-toggle" type="button" aria-label="Open your space" aria-expanded="false" aria-controls="nav-content"><span>✳</span></button><div id="nav-content" hidden><h2>Your space</h2><p class="muted">Profile and settings will live here.</p></div></aside>
    <footer><span id="hint">Open an orb to explore</span></footer>
    <p id="announcement" class="sr-only" role="status" aria-live="polite">Loading your library…</p>
    <p id="error" hidden></p>
  </main>
</body>
</html>
